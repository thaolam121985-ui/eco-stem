<!DOCTYPE html>
<html lang="vi">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* Tối ưu hóa Full-screen tràn viền */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0e1117;
            color: #ffffff;
            overflow: hidden; /* Khóa cuộn trang chính để tạo cảm giác App chuyên nghiệp */
        }

        /* Bố cục tổng thể dạng lưới Flexbox */
        .app-wrapper {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Thanh Tiêu đề Gọn gàng phía trên */
        header {
            background: #161b22;
            padding: 10px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            color: #4caf50;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            color: #8b949e;
            font-size: 13px;
            margin: 0;
        }

        /* Thân trang chia làm 2 cột Full-screen */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Cột bên trái: Nhập liệu & Nhiệm vụ (Có hỗ trợ cuộn nếu màn hình nhỏ) */
        .left-panel {
            flex: 1;
            padding: 20px 25px;
            overflow-y: auto;
            border-right: 1px solid #30363d;
            background: #0d1117;
        }

        /* Cột bên phải: Kết quả & Đồ thị trực quan */
        .right-panel {
            flex: 1.2;
            padding: 20px 25px;
            overflow-y: auto;
            background: #161b22;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {

            font-size: 16px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 6px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* CSS cho các thanh trượt và form */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }

            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 5px solid #4caf50;
        }

<!DOCTYPE html>

    <title>EcoFootprint - Nền Tảng Tính Toán Dấu Chân Carbon</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0e1117; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #161b22; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        h1 { color: #4caf50; text-align: center; margin-bottom: 5px; }
        h2 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-top: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select, input[type="range"] { width: 100%; padding: 10px; background: #21262d; border: 1px solid #30363d; border-radius: 6px; color: white; box-sizing: border-box; }
        .result-box { background: #21262d; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: center; border-left: 5px solid #4caf50; }
        .metric { font-size: 26px; font-weight: bold; color: #4caf50; margin: 5px 0; }
        .progress-container { margin-top: 15px; background: #1f242c; padding: 15px; border-radius: 8px; }
        .progress-bar { background: #30363d; border-radius: 5px; overflow: hidden; margin-top: 5px; margin-bottom: 15px; }
        .progress-fill { background: #4caf50; height: 12px; width: 0%; transition: width 0.4s ease; }
        .info-card { background: rgba(56, 139, 253, 0.1); border: 1px solid #388bfd; padding: 15px; border-radius: 8px; margin-top: 15px; line-height: 1.5; }
        
        /* CSS cho tính năng Game đổi Rank */
        .task-item { display: flex; align-items: center; background: #21262d; padding: 12px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #30363d; cursor: pointer; }
        .task-item input { margin-right: 12px; transform: scale(1.2); cursor: pointer; }
        .rank-badge { display: inline-block; padding: 10px 20px; background: #238636; color: white; border-radius: 6px; font-weight: bold; font-size: 18px; margin-top: 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        
        /* CSS cho công thức khoa học */
        .formula-box { background: #0d1117; border: 1px solid #30363d; padding: 15px; border-radius: 6px; font-family: 'Courier New', Courier, monospace; color: #ff7b72; text-align: center; font-size: 14px; margin: 15px 0; overflow-x: auto; }
    </style>
</head>
